[package]
name = "esp32s3-refresh"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[workspace]

[dependencies]
epd-waveshare = { path = "../..", default-features = false, features = ["epd2in13_v3"] }
embedded-hal = "1.0.0"
embedded-hal-bus = "=0.3.0"
esp-hal = { version = "=1.1.0", features = ["esp32s3", "unstable"] }
esp-println = { version = "=0.17.0", default-features = false, features = ["esp32s3", "jtag-serial", "critical-section"] }
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32s3"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
